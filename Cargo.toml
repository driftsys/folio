[workspace]
resolver = "2"
members = [
    "crates/folio-cli",
    "crates/folio-core",
    "crates/folio-manifest",
    "crates/folio-templates",
    "crates/folio-tools",
    "crates/folio-fmt",
    "crates/folio-release",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/driftsys/folio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
thiserror = "1"
clap = { version = "4", features = ["derive"] }
