[workspace]
resolver = "2"
members = [
    "crates/repofolio",
    "crates/repofolio-core",
    "crates/repofolio-manifest",
    "crates/repofolio-templates",
    "crates/repofolio-tools",
    "crates/repofolio-fmt",
    "crates/repofolio-release",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/driftsys/folio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = { version = "0.22", features = ["serde"] }
thiserror = "1"
clap = { version = "4", features = ["derive"] }
jsonschema = "0.54"
yaml-rust2 = "0.12"

# Internal crates. The version literal is unavoidable — Cargo cannot inherit
# workspace.package.version into a dependency requirement, and a path-only
# dependency cannot be published — but declaring them here puts every version
# string that must move together into one file. When folio adopts
# `git std bump` at v0.5 each still needs its own [[version_files]] entry:
# that engine matches the first occurrence only, which is why git-std carries
# five entries against its own Cargo.toml for four internal crates.
# Same pattern as driftsys/git-std.
repofolio-core = { version = "0.1.0", path = "crates/repofolio-core" }
repofolio-manifest = { version = "0.1.0", path = "crates/repofolio-manifest" }
