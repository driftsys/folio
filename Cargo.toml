[workspace]
resolver = "2"
members = [
    "crates/repofolio",
    "crates/repofolio-core",
    "crates/repofolio-manifest",
    "crates/repofolio-templates",
    "crates/repofolio-tools",
    "crates/repofolio-fmt",
    "crates/repofolio-release",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/driftsys/folio"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.22"
thiserror = "1"
clap = { version = "4", features = ["derive"] }

# Internal crates. The version literal is unavoidable — Cargo cannot inherit
# workspace.package.version into a dependency requirement — but keeping the
# declarations here means one place to update, and gives `git std bump` a
# single regex target via [[version_files]] when folio adopts it at v0.5.
# Same pattern as driftsys/git-std.
repofolio-core = { version = "0.1.0", path = "crates/repofolio-core" }
repofolio-manifest = { version = "0.1.0", path = "crates/repofolio-manifest" }
